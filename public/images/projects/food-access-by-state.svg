<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Share of low-access census tracts by state</title>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- gridlines -->
  <g stroke="#e6e5e1" stroke-width="1">
    <line x1="120" y1="300" x2="660" y2="300"/>
    <line x1="120" y1="235" x2="660" y2="235"/>
    <line x1="120" y1="170" x2="660" y2="170"/>
    <line x1="120" y1="105" x2="660" y2="105"/>
    <line x1="120" y1="40"  x2="660" y2="40"/>
  </g>
  <line x1="120" y1="40" x2="120" y2="300" stroke="#d3d2cd" stroke-width="1"/>

  <!-- bars: 5% -> 65px -->
  <g fill="#2c4a6e">
    <rect x="180" y="53"  width="90" height="247"/>
    <rect x="360" y="131" width="90" height="169"/>
    <rect x="540" y="183" width="90" height="117"/>
  </g>

  <!-- value labels -->
  <g fill="#4a4a47" font-size="13" text-anchor="middle">
    <text x="225" y="43">19%</text>
    <text x="405" y="121">13%</text>
    <text x="585" y="173">9%</text>
  </g>

  <!-- state labels -->
  <g fill="#4a4a47" font-size="13" text-anchor="middle">
    <text x="225" y="322">Maine</text>
    <text x="405" y="322">Vermont</text>
    <text x="585" y="322">New Hampshire</text>
  </g>

  <!-- y labels -->
  <g fill="#6a6a67" font-size="12" text-anchor="end">
    <text x="108" y="304">0%</text>
    <text x="108" y="174">10%</text>
    <text x="108" y="44">20%</text>
  </g>

  <text x="30" y="170" fill="#6a6a67" font-size="12" text-anchor="middle" transform="rotate(-90 30 170)">Tracts &gt; 10 road miles from a grocery store</text>
</svg>
