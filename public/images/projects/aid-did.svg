<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>On-time renewal by campus group, 2021 to 2024</title>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- gridlines -->
  <g stroke="#e6e5e1" stroke-width="1">
    <line x1="90" y1="60"  x2="660" y2="60"/>
    <line x1="90" y1="135" x2="660" y2="135"/>
    <line x1="90" y1="210" x2="660" y2="210"/>
    <line x1="90" y1="285" x2="660" y2="285"/>
    <line x1="90" y1="360" x2="660" y2="360"/>
  </g>
  <line x1="90" y1="60" x2="90" y2="360" stroke="#d3d2cd" stroke-width="1"/>

  <!-- campaign marker -->
  <line x1="543" y1="60" x2="543" y2="360" stroke="#8a8a86" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="549" y="76" fill="#6a6a67" font-size="11">Campaign begins</text>

  <!-- treated series -->
  <polyline points="110,225 254,210 398,225 543,141" fill="none" stroke="#2c4a6e" stroke-width="2.5"/>
  <g fill="#2c4a6e">
    <circle cx="110" cy="225" r="4"/>
    <circle cx="254" cy="210" r="4"/>
    <circle cx="398" cy="225" r="4"/>
    <circle cx="543" cy="141" r="4"/>
  </g>

  <!-- untreated series -->
  <polyline points="110,255 254,233 398,240 543,225" fill="none" stroke="#9aa7b4" stroke-width="2.5"/>
  <g fill="#9aa7b4">
    <circle cx="110" cy="255" r="4"/>
    <circle cx="254" cy="233" r="4"/>
    <circle cx="398" cy="240" r="4"/>
    <circle cx="543" cy="225" r="4"/>
  </g>

  <!-- y labels -->
  <g fill="#6a6a67" font-size="12" text-anchor="end">
    <text x="78" y="64">90%</text>
    <text x="78" y="139">85%</text>
    <text x="78" y="214">80%</text>
    <text x="78" y="289">75%</text>
    <text x="78" y="364">70%</text>
  </g>

  <!-- x labels -->
  <g fill="#6a6a67" font-size="12" text-anchor="middle">
    <text x="110" y="382">2021</text>
    <text x="254" y="382">2022</text>
    <text x="398" y="382">2023</text>
    <text x="543" y="382">2024</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#4a4a47">
    <rect x="120" y="400" width="14" height="3" fill="#2c4a6e"/>
    <text x="140" y="405">Treated campuses</text>
    <rect x="300" y="400" width="14" height="3" fill="#9aa7b4"/>
    <text x="320" y="405">Comparison campuses</text>
  </g>
</svg>
